<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}</style></head><body>
<script async src="three/es-module-shims.js"></script>
<script type="importmap">{ "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import * as M from './js/money.js';
const q = new URLSearchParams(location.search), what = q.get('w') || 'bill';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x3a3530);
s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6)); const L = new THREE.DirectionalLight(0xffffff, 2.2); L.position.set(0.3, 1, 0.5); s.add(L);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.001, 10);
if (what === 'bill') { [1, 5, 10, 20].forEach((d, i) => { const b = M.makeBill(d); b.position.set(-0.085 + (i % 2) * 0.17, 0, -0.04 + Math.floor(i / 2) * 0.08); s.add(b); }); cam.position.set(0, 0.42, 0.02); cam.lookAt(0, 0, 0); }
if (what === 'coin') { const a = M.makeCoin(true), b = M.makeCoin(false); a.position.x = -0.015; b.position.x = 0.015; s.add(a, b); const c = M.makeCoin(true); c.position.set(0, 0.006, 0.03); c.rotation.x = 1.2; s.add(c); cam.position.set(0, 0.11, 0.035); cam.lookAt(0, 0, 0.004); }
if (what === 'misc') { const st = M.makeStack(10, 20); st.position.set(-0.08, 0, 0); s.add(st); const w = M.makeWallet(); w.position.set(0.09, 0.009, 0); s.add(w); const p = M.makePile(12); p.position.set(0, 0, 0.12); s.add(p); const bk = M.makeBill(20); bk.rotation.z = Math.PI; bk.position.set(0, 0.01, -0.11); s.add(bk); cam.position.set(0, 0.42, 0.25); cam.lookAt(0, 0, 0); }
r.render(s, cam); window.done = true;
</script></body></html>
